# Phase 1 fixture. The controller only reads the network-status annotation, so
# any working attachment exercises it -- and the bridge plugin needs no host
# setup at all, which keeps the E2E from mutating the node.
# Use nad-macvlan.yaml once the node agent needs the real macvlan semantics.
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: sec-net
  namespace: ms-e2e
spec:
  config: '{
    "cniVersion":"0.3.1",
    "name":"sec-net",
    "plugins":[{
      "type":"bridge",
      "bridge":"ms-e2e0",
      "isGateway":true,
      "ipam":{"type":"host-local","ranges":[[{"subnet":"10.244.77.0/24"}]]}
    }]
  }'
