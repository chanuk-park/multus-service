apiVersion: apps/v1
kind: Deployment
metadata:
  name: amf
  namespace: ms-e2e
spec:
  replicas: 1
  selector:
    matchLabels: {app: oai-amf}
  template:
    metadata:
      labels: {app: oai-amf}
      annotations:
        k8s.v1.cni.cncf.io/networks: sec-net
    spec:
      containers:
        - name: sh
          image: docker.io/library/busybox:1.36
          command: ["sh","-c","mkdir -p /www && echo amf > /www/index.html && httpd -f -h /www -p 8080"]
          ports: [{containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /, port: 8080}
            periodSeconds: 1
