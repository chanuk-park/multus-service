apiVersion: v1
kind: Service
metadata:
  name: amf-n2
  namespace: ms-e2e
  annotations:
    # Which attachment's addresses to publish. A bare name resolves in this
    # Service's namespace.
    secondary-service.boanlab.io/network: sec-net
    # Which Pods to consider. This is an annotation and not spec.selector on
    # purpose: a real selector would hand the Service to the built-in
    # EndpointSlice controller, which publishes primary Pod IPs.
    secondary-service.boanlab.io/workload-selector: app=oai-amf
spec:
  clusterIP: None
  # no selector, by design
  ports:
    - name: n2
      port: 8080
      protocol: TCP
