# Deterministic duplicate: static IPAM hands every Pod the same address, which
# is what per-node host-local IPAM does accidentally across nodes. Used to test
# that the controller publishes one endpoint and reports the collision.
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: sec-net-fixed
  namespace: ms-e2e
spec:
  config: '{
    "cniVersion":"0.3.1",
    "name":"sec-net-fixed",
    "plugins":[{
      "type":"bridge",
      "bridge":"ms-e2e0",
      "ipam":{"type":"static","addresses":[{"address":"10.244.77.250/24"}]}
    }]
  }'
