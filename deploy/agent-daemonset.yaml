apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: multus-service-agent
  namespace: multus-service-system
  labels: {app: multus-service-agent}
spec:
  selector:
    matchLabels: {app: multus-service-agent}
  template:
    metadata:
      labels: {app: multus-service-agent}
    spec:
      serviceAccountName: multus-service-agent
      # The sandbox PID fallback reads /proc/<pid>/ns/net, which only resolves
      # in the host PID namespace.
      hostPID: true
      containers:
        - name: agent
          image: boanlab/multus-service-agent:dev
          imagePullPolicy: IfNotPresent
          args:
            - --resync=1s
            # Full state is resent this often regardless of change, so health is
            # a renewable lease rather than an event log.
            #
            # Two relationships matter: refresh must stay well under the
            # controller's --health-ttl, or unchanged attachments expire between
            # snapshots; and resync must be no larger than refresh, so a change
            # is sent as a delta immediately instead of waiting for the next
            # full send.
            - --refresh=2s
            # Real ICMP probe, sourced from inside each Pod netns and bound to
            # the secondary address and interface. A network opts in by setting
            # secondary-service.boanlab.io/health-target on its NAD; without one
            # no path state is produced and the endpoint stays not-ready.
            - --path-probe=icmp
            - --probe-interval=500ms
            # Below the interval on purpose: a failing path fails by timing
            # out, and a timeout longer than the interval stretches the
            # effective sampling period.
            - --probe-timeout=400ms
            - --failure-threshold=3
            - --success-threshold=2
            - --events-file=-
            - --zap-log-level=info
          env:
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
            - name: CONTROLLER_ADDRESS
              value: multus-service-controller.multus-service-system.svc:9090
          securityContext:
            # Entering another network namespace needs CAP_SYS_ADMIN, and both
            # the CRI socket (root:root 0660) and the namespace files under
            # /var/run/netns are root-owned. This is the same privilege level
            # multus itself runs at. runAsUser overrides the image's nonroot
            # user, which the shared Dockerfile sets for the controller.
            privileged: true
            runAsUser: 0
          volumeMounts:
            - {name: cri, mountPath: /run/k3s/containerd/containerd.sock, readOnly: true}
            - {name: netns, mountPath: /var/run/netns, mountPropagation: HostToContainer}
          ports:
            - {name: probe, containerPort: 8081}
          livenessProbe:
            httpGet: {path: /healthz, port: probe}
            initialDelaySeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
      volumes:
        # CRI is how a Pod UID becomes a sandbox netns. Nothing here goes via
        # an IP address: per-node IPAM makes addresses ambiguous across nodes.
        - name: cri
          hostPath: {path: /run/k3s/containerd/containerd.sock, type: Socket}
        # Sandbox namespaces appear and disappear while the agent runs, so the
        # mount has to see host-side changes.
        - name: netns
          hostPath: {path: /var/run/netns, type: DirectoryOrCreate}
      tolerations:
        - operator: Exists
