apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: multus-service-agent
  namespace: multus-service-system
  labels: {app: multus-service-agent}
spec:
  selector:
    matchLabels: {app: multus-service-agent}
  template:
    metadata:
      labels: {app: multus-service-agent}
    spec:
      serviceAccountName: multus-service-agent
      # The sandbox PID fallback reads /proc/<pid>/ns/net, which only resolves
      # in the host PID namespace.
      hostPID: true
      containers:
        - name: agent
          image: boanlab/multus-service-agent:dev
          imagePullPolicy: IfNotPresent
          args:
            - --resync=2s
            - --events-file=-
            - --zap-log-level=info
          env:
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
          securityContext:
            # Entering another network namespace needs CAP_SYS_ADMIN, and both
            # the CRI socket (root:root 0660) and the namespace files under
            # /var/run/netns are root-owned. This is the same privilege level
            # multus itself runs at. runAsUser overrides the image's nonroot
            # user, which the shared Dockerfile sets for the controller.
            privileged: true
            runAsUser: 0
          volumeMounts:
            - {name: cri, mountPath: /run/k3s/containerd/containerd.sock, readOnly: true}
            - {name: netns, mountPath: /var/run/netns, mountPropagation: HostToContainer}
          ports:
            - {name: probe, containerPort: 8081}
          livenessProbe:
            httpGet: {path: /healthz, port: probe}
            initialDelaySeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
      volumes:
        # CRI is how a Pod UID becomes a sandbox netns. Nothing here goes via
        # an IP address: per-node IPAM makes addresses ambiguous across nodes.
        - name: cri
          hostPath: {path: /run/k3s/containerd/containerd.sock, type: Socket}
        # Sandbox namespaces appear and disappear while the agent runs, so the
        # mount has to see host-side changes.
        - name: netns
          hostPath: {path: /var/run/netns, type: DirectoryOrCreate}
      tolerations:
        - operator: Exists
