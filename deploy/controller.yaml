apiVersion: apps/v1
kind: Deployment
metadata:
  name: multus-service-controller
  namespace: multus-service-system
  labels: {app: multus-service-controller}
spec:
  replicas: 1
  selector:
    matchLabels: {app: multus-service-controller}
  template:
    metadata:
      labels: {app: multus-service-controller}
    spec:
      serviceAccountName: multus-service-controller
      containers:
        - name: controller
          image: boanlab/multus-service-controller:dev
          imagePullPolicy: IfNotPresent
          args:
            - --leader-elect=true
            - --health-ttl=5s
            - --health-bind-address=:9090
            - --health-audience=health-controller
            - --tls-dir=/etc/multus-service/tls
            # JSONL measurement stream. Sent to stdout so it can be collected
            # with `kubectl logs` during an evaluation run.
            - --events-file=-
            - --zap-log-level=info
          ports:
            - {name: metrics, containerPort: 8080}
            - {name: probe, containerPort: 8081}
            - {name: health, containerPort: 9090}
          livenessProbe:
            httpGet: {path: /healthz, port: probe}
            initialDelaySeconds: 10
          readinessProbe:
            httpGet: {path: /readyz, port: probe}
            initialDelaySeconds: 5
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tls, mountPath: /etc/multus-service/tls, readOnly: true}
      volumes:
        - name: tls
          secret: {secretName: controller-tls}
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
---
# The agents report here. A ClusterIP is enough: the transport carries health
# observations for attachments the controller already knows about, so it is not
# a discovery surface.
apiVersion: v1
kind: Service
metadata:
  name: multus-service-controller
  namespace: multus-service-system
  labels: {app: multus-service-controller}
spec:
  selector: {app: multus-service-controller}
  ports:
    - {name: health, port: 9090, targetPort: health, protocol: TCP}
